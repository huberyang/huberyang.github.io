<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <title>我们的时间线</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>💕</text></svg>">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <div class="starfield" id="starfield" aria-hidden="true"></div>

  <div class="loader" id="loader" aria-hidden="true">
    <div class="loader-hearts">
      <span></span><span></span><span></span><span></span><span></span>
      <span></span><span></span><span></span><span></span><span></span>
      <span></span><span></span><span></span><span></span><span></span>
      <span></span><span></span><span></span><span></span><span></span>
      <span></span><span></span><span></span><span></span><span></span>
      <span></span><span></span><span></span><span></span><span></span>
    </div>
    <div class="loader-heart">💗</div>
    <p class="loader-text">正在加载我们的故事<span class="loader-dots"><span>.</span><span>.</span><span>.</span></span></p>
  </div>

  <header class="hero" id="hero">
    <div class="hero-sparkles" aria-hidden="true">
      <span></span><span></span><span></span><span></span><span></span>
      <span></span><span></span><span></span><span></span><span></span>
    </div>
    <div class="hero-inner">
      <div class="hero-flourish" aria-hidden="true"><span></span>♥<span></span></div>
      <p class="hero-eyebrow">我们的</p>
      <h1 class="hero-title">时间线</h1>
      <div class="hero-counter">
        <span id="dayCount">0</span>
        <span class="hero-counter-label">天</span>
      </div>
      <p class="hero-since">自 <time id="sinceDate">2026-01-31</time> 起，我们在一起</p>
      <a class="hero-scroll" href="#timeline" aria-label="向下滚动">↓</a>
    </div>
  </header>

  <main>
    <section id="timeline" class="timeline-section">
      <h2 class="section-title">大事记</h2>
      <div class="timeline" id="timelineList"></div>
    </section>

    <p class="footer">待续 …</p>

    <section class="profile-section">
      <h2 class="section-title">关于她</h2>
      <div class="profile-card">
        <div class="profile-photo" data-photo-id="profile">
          <img data-src="assets/photos/profile.jpg" alt="她的照片">
        </div>
        <dl class="profile-facts">
          <div class="profile-fact"><dt>生日</dt><dd>1997年11月5日 · 天蝎座</dd></div>
          <div class="profile-fact"><dt>身高</dt><dd>165cm</dd></div>
          <div class="profile-fact"><dt>衣服尺码</dt><dd>S/M</dd></div>
          <div class="profile-fact"><dt>裤子尺码</dt><dd>M/L</dd></div>
          <div class="profile-fact"><dt>鞋码</dt><dd>37/38</dd></div>
          <div class="profile-fact"><dt>忌口</dt><dd>香菜、生食日料、芥末、鱼皮、大蒜</dd></div>
          <div class="profile-fact"><dt>小爱好</dt><dd>小蛋糕、奶茶</dd></div>
          <div class="profile-fact"><dt>爱吃的菜</dt><dd>蛋炒饭、老母鸡汤面、土豆烧鸡、红烧带鱼、玉米排骨汤、糖醋鱼、可乐鸡翅、白灼虾</dd></div>
        </dl>
      </div>
    </section>

    <footer class="site-footer">
      <img class="visit-counter" src="https://visitor-badge.laobi.icu/badge?page_id=huberyang.love-yifan" alt="访问次数" loading="lazy">
    </footer>
  </main>

  <div class="lightbox" id="lightbox">
    <img id="lightboxImg" src="" alt="">
  </div>

  <script src="js/data.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
